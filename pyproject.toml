[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "live2d-semi-auto"
version = "0.1.0"
description = "Editable illustration parts and embeddable animated Web characters"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "opencv-python-headless>=4.10,<6",
  "PySide6>=6.8,<7",
  "psd-tools>=1.23,<2",
]

[project.optional-dependencies]
ai = ["torch>=2.6,<3"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
live2d-semi-auto = "live2d_semi_auto.__main__:main"
live2d-semi-auto-web = "live2d_semi_auto.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ai: explicitly enabled tests using a verified local model"]
